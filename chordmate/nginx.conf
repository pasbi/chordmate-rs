server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Serve index.html for all non-file requests (SPA fallback)
        try_files $uri /index.html;
    }

    # Optional: serve static assets normally
    location /assets/ {
        try_files $uri =404;
    }
}
