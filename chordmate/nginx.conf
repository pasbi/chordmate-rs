server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Serve index.html for all non-file requests (SPA fallback)
        try_files $uri /index.html;
    }

    # The page itself is checked anew on every load, so that a new build is picked up at once
    # (its scripts and styles have content hashes in their names and may be cached).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Optional: serve static assets normally
    location /assets/ {
        try_files $uri =404;
    }
}
