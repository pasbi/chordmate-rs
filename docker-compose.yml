# Started by scripts/dev.sh (profile dev: database and pgAdmin; backend and frontend run outside
# Docker) and scripts/prod.sh (profile prod: database, migrations, backend, frontend at
# http://localhost:8080). Both profiles share the database container.

# How the backend and its migrations reach the database (read by backend/src/arguments.rs).
x-database-connection: &database-connection
  DB_HOST: database
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASSWORD: "${POSTGRES_PASSWORD}"

services:
  # Applies new migrations from backend/migrations, then exits; the backend starts after it.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["./migrate"]
    environment: *database-connection
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - "prod"
    networks:
      internal:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment: *database-connection
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    command: ["--port", "3000", "--log-level", "info"]
    profiles:
      - "prod"
    networks:
      internal:

  # The one database of both setups: dev and prod share the data, so they must share the
  # Postgres server too. Two servers on one data directory corrupt it, and Postgres can't tell
  # from inside a container that another one runs. The fixed name makes Docker refuse a second
  # container, also from a manual `docker compose -p other …`.
  database:
    container_name: chordmate-database
    image: 'docker.io/postgres:latest'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"  # for backends running outside Docker (dev.sh), on this PC only
    profiles:
      - "dev"
      - "prod"
    networks:
      internal:

  pgadmin:
    image: 'docker.io/dpage/pgadmin4:latest'
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    ports:
      - 15080:80
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin/
    profiles:
      - "dev"
    networks:
      internal:

  frontend:
    build:
      context: ./chordmate
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    profiles:
      - "prod"
    networks:
      internal:

volumes:
  pg-data:
  pgadmin-data:

networks:
  internal:
