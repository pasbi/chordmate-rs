# Commands:
# docker compose --profile dev up     # Start dev database + pgadmin, requires the back- and front-end to be run manually:
#                                          cargo run --package chordmate --bin chordmate -- --db-host ...
#                                          npm run dev  # tells you where to open your browser
# docker compose --profile prod up    # Start production all-in-one, find the app at `http://localhost:8080`.

x-database-base: &database-base
    image: 'docker.io/postgres:latest'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pg-data:/var/lib/postgresql
    networks:
      internal:
        aliases:
          - database

# How the backend and its migrations reach the database (read by backend/src/arguments.rs).
x-database-connection: &database-connection
  DB_HOST: database
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASSWORD: "${POSTGRES_PASSWORD}"

services:
  # Applies new migrations from backend/migrations, then exits; the backend starts after it.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["./migrate"]
    environment: *database-connection
    depends_on:
      database-prod:
        condition: service_healthy
    profiles:
      - "prod"
    networks:
      internal:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env
    environment: *database-connection
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    command: ["--port", "3000", "--log-level", "info"]
    profiles:
      - "prod"
    networks:
      internal:

  database-dev:
    <<: *database-base
    ports:
      - "5432:5432"  # only required to connect backends from outside to the database
    profiles:
      - "dev"

  database-prod:
    <<: *database-base
    profiles:
      - "prod"

  pgadmin:
    image: 'docker.io/dpage/pgadmin4:latest'
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    ports:
      - 15080:80
    depends_on:
      database-dev:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin/
    profiles:
      - "dev"
    networks:
      internal:

  frontend:
    build:
      context: ./chordmate
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    profiles:
      - "prod"
    networks:
      internal:

volumes:
  pg-data:
  pgadmin-data:

networks:
  internal:
